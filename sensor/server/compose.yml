services:
  api:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    environment:
      API_KEY: ${API_KEY:?Set API_KEY}
    ports:
      - "127.0.0.1:8095:8095"
    volumes:
      - readings:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  prometheus:
    image: docker.io/prom/prometheus:v3.2.1
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.external-url=${PUBLIC_URL}/prometheus/
      - --web.route-prefix=/
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - metrics:/prometheus
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  grafana:
    image: docker.io/grafana/grafana:11.6.0
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - dashboards:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  readings:
  metrics:
  dashboards:
